name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    name: lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      # Same hooks developers get on commit, so CI and prek.toml cannot drift.
      # The betterleaks hook only sees staged changes, so the `secrets` job
      # below is what actually scans the repository here.
      - run: uv run prek run --all-files --show-diff-on-failure

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan the whole history with betterleaks
        # The checkout is owned by the runner user but the container runs as
        # root, which trips git's dubious-ownership guard. GIT_CONFIG_* marks
        # the bind mount safe without depending on either UID.
        #
        # The image is pinned by digest, not by `:v1.8.1`: a tag can be moved,
        # and this scan is a control. (The comment lives here rather than
        # inside the command — a `#` line between backslash-continued lines is
        # swallowed by the continuation and comments out the rest.)
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/betterleaks/betterleaks@sha256:8b9d12db5e11ca798029da44923503de5d8cfff6992cffaaa6722fbeb9fc7797 \
            git /repo --redact --verbose

  unit:
    name: unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest --cov=passenv --cov-report=term-missing

  build:
    name: build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # The release workflow builds the very same artifacts; failing here means
      # failing after a version has already been tagged, so check it on the PR.
      - run: uv build
      - run: uvx twine check --strict dist/*

  integration:
    name: integration (real pass + gpg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pass and gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y pass gnupg
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run pytest -m integration
